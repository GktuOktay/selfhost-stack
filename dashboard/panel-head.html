<!-- selfhost-panel-start: Panel ana sayfa dashboard (selfhost-stack). Silmek için bu iki işaret arasını sil. -->
<style>
  .tri-layout-container:has(.dash-root) { grid-template-columns: minmax(0,1fr) !important; margin-inline: 18px; }
  .tri-layout-container:has(.dash-root) .tri-layout-left, .tri-layout-container:has(.dash-root) .tri-layout-right { display: none !important; }
  .tri-layout-container:has(.dash-root) .tri-layout-middle { grid-column: 1 / -1 !important; max-width: none !important; }
  .tri-layout-container:has(.dash-root) .tri-layout-middle-contents { max-width: none !important; margin: 0 !important; padding: 10px 16px 14px !important; }
  .content-wrap:has(.dash-root) { padding: 14px 20px !important; }
  .content-wrap:has(.dash-root) > h1, .content-wrap:has(.dash-root) .page-title, .content-wrap:has(.dash-root) .breadcrumbs { display: none !important; }
  .page-content:has(.dash-root), .page-content .dash-root { max-width: none !important; padding: 0 !important; }
  .dash-root { --dw: #f59e0b; --dp: #3b82f6; --dr: #10b981; --ds: #a855f7; --dl: rgba(127,127,127,.22); }
  .dash-root .dash-tools { font-size: 12px; opacity: .65; margin: 0 0 8px; }
  .dash-root .dash-tools a { margin: 0 5px; }
  .dash-root .dash-grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 14px; }
  .dash-root .dash-c6 { grid-column: span 6; } .dash-root .dash-c12 { grid-column: span 12; }
  @media (max-width: 1000px) { .dash-root .dash-c6 { grid-column: span 12; } }
  .dash-root .dash-panel { border: 1px solid var(--dl); background: rgba(127,127,127,.05); border-radius: 14px; padding: 10px 16px 6px; min-width: 0; border-top: 3px solid var(--acc, var(--dl)); }
  .dash-root .dash-s-wait { --acc: var(--dw); } .dash-root .dash-s-prog { --acc: var(--dp); } .dash-root .dash-s-recent { --acc: var(--dr); } .dash-root .dash-s-shelves { --acc: var(--ds); }
  .dash-root .dash-ph { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; margin: 0 0 10px; }
  .dash-root .dash-ph::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); margin-right: 8px; flex: 0 0 auto; }
  .dash-root .dash-n { margin-left: auto; }
  .dash-root .dash-n { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--acc); color: #fff; letter-spacing: 0; font-weight: 700; }
  .dash-root .dash-sum { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
  .dash-root .dash-pj { display: inline-flex; align-items: center; gap: 8px; padding: 3px 10px; border-radius: 10px; border: 1px solid var(--dl); background: rgba(127,127,127,.07); font-size: 12px; font-weight: 600; text-decoration: none; color: inherit; }
  .dash-root .dash-pj:hover { background: rgba(127,127,127,.15); }
  .dash-root .dash-pj em { font-style: normal; font-weight: 600; font-size: 11px; padding: 1px 8px; border-radius: 99px; }
  .dash-root .dash-pj .o { background: rgba(245,158,11,.2); color: #d97706; } .dash-root .dash-pj .d { background: rgba(16,185,129,.2); color: #059669; } .dash-root .dash-pj .z { background: rgba(127,127,127,.18); opacity: .8; }
  .dash-root .dash-it { display: flex; gap: 10px; align-items: baseline; padding: 6px 4px; border-top: 1px solid var(--dl); font-size: 14px; text-decoration: none; color: inherit; line-height: 1.35; border-radius: 6px; }
  .dash-root .dash-it:hover { background: rgba(127,127,127,.1); }
  .dash-root .dash-id { flex: 0 0 44px; font-size: 12px; font-weight: 700; opacity: .7; }
  .dash-root .dash-tx { flex: 1 1 36%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .dash-root .dash-rc { flex: 1 1 30%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; opacity: .6; }
  .dash-root .dash-mt { flex: 0 1 auto; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; opacity: .55; }
  .dash-root .dash-chips { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; }
  .dash-root .dash-chip { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; background: rgba(127,127,127,.18); }
  .dash-root .dash-chip.soru { background: rgba(245,158,11,.2); color: #d97706; } .dash-root .dash-chip.is { background: rgba(59,130,246,.2); color: #2563eb; }
  .dash-root .dash-chip.acik { background: rgba(239,68,68,.16); color: #dc2626; } .dash-root .dash-chip.pj { background: rgba(168,85,247,.16); color: #9333ea; }
  .dash-root .dash-em { font-size: 13px; opacity: .55; padding: 8px 0 12px; }
  .dash-root .dash-ch { display: inline-block; margin: 0 8px 8px 0; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--dl); font-size: 13px; font-weight: 600; text-decoration: none; color: inherit; }
  .dash-root .dash-ch:hover { background: rgba(127,127,127,.14); }
  .dash-root .dash-ch i { font-style: normal; opacity: .55; margin-left: 8px; font-size: 11px; font-weight: 500; }
  @media (max-width: 800px) { .dash-root .dash-rc { display: none; } }
</style>
<script>
(function () {
  function ready(f) { if (document.readyState !== "loading") f(); else document.addEventListener("DOMContentLoaded", f); }
  ready(function () {
    var root = document.querySelector(".dash-root"); if (!root) return;
    function api(u) { var k = "dash:" + u, c = null; try { c = JSON.parse(sessionStorage.getItem(k) || "null"); } catch (x) {} if (c && Date.now() - c.t < 120000) return Promise.resolve(c.d); return fetch("/api" + u, { credentials: "same-origin", headers: { Accept: "application/json" } }).then(function (r) { if (!r.ok) { if (c) return { __stale: c.d }; throw r.status; } return r.json(); }).then(function (d) { if (d && d.__stale) return d.__stale; try { sessionStorage.setItem(k, JSON.stringify({ t: Date.now(), d: d })); } catch (x) {} return d; }); }
    function slot(n) { return root.querySelector(".dash-s-" + n); }
    function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
    function clean(s) { return (s || "").replace(/\*\*|\x60/g, ""); }
    function ago(s) { var d = (Date.now() - Date.parse(s)) / 1000; if (d < 3600) return Math.max(1, Math.round(d / 60)) + " dk"; if (d < 86400) return Math.round(d / 3600) + " sa"; return Math.round(d / 86400) + " g"; }
    function body(n) { var s = slot(n); if (!s) return null; var b = s.querySelector(".dash-body"); b.textContent = ""; return b; }
    function count(n, v) { var s = slot(n); var h = s && s.querySelector(".dash-ph"); if (!h) return; var c = h.querySelector(".dash-n"); if (!c) { c = el("span", "dash-n"); h.appendChild(c); } c.textContent = v; }
    function fail(n) { var b = body(n); if (b) b.appendChild(el("div", "dash-em", "Yüklenemedi")); }
    function list(n, items, total) {
      var b = body(n); if (!b) return; count(n, total);
      if (!items.length) { b.appendChild(el("div", "dash-em", "Hiçbir şey yok")); return; }
      items.forEach(function (it) { var a = el("a", "dash-it"); a.href = it.href; a.appendChild(el("span", "dash-tx", it.text)); if (it.meta) a.appendChild(el("span", "dash-mt", it.meta)); b.appendChild(a); });
    }
    var shelfOf = {};
    var shelves = api("/shelves?count=100").then(function (l) {
      return Promise.all(l.data.map(function (sh) { return api("/shelves/" + sh.id).then(function (d) { (d.books || []).forEach(function (b) { shelfOf[b.id] = sh.name; }); return { name: sh.name, slug: sh.slug, n: (d.books || []).length }; }); }));
    });
    function parse(md) {
      var open = [], done = 0, mode = "";
      (md || "").split("\n").forEach(function (line) {
        if (/^##\s/.test(line)) { mode = /bekle/i.test(line) ? "open" : (/cevaplanan|yapılan/i.test(line) ? "done" : ""); return; }
        if (!mode || line.charAt(0) !== "|" || /^\|\s*-/.test(line) || /^\|\s*#\s*\|/.test(line)) return;
        var c = line.split("|").slice(1, -1).map(function (x) { return x.trim(); });
        if (c.length < 3) return;
        if (mode === "open") { if (/^a[çc]ık$/i.test(c[c.length - 1])) open.push({ id: c[0], text: clean(c[1]), rec: clean(c[2]) }); } else done++;
      });
      return { open: open, done: done };
    }
    function collect(name, kind) {
      return api("/pages?count=100&filter[name]=" + encodeURIComponent(name)).then(function (l) {
        return Promise.all(l.data.map(function (p) { return api("/pages/" + p.id).then(function (d) { var r = parse(d.markdown); r.kind = kind; r.book = p.book_id; r.href = "/link/" + p.id; return r; }).catch(function () { return null; }); }));
      });
    }
    Promise.all([shelves, collect("Sorular", "Soru"), collect("Beklenenler", "İş")]).then(function (r) {
      var pages = r[1].concat(r[2]).filter(Boolean), by = {}, rows = [];
      pages.forEach(function (p) { var pj = shelfOf[p.book] || "Diğer"; var o = by[pj] || (by[pj] = { open: 0, done: 0 }); o.open += p.open.length; o.done += p.done; p.open.forEach(function (it) { rows.push({ it: it, kind: p.kind, pj: pj, href: p.href }); }); });
      var b = body("wait");
      if (b) {
        count("wait", rows.length);
        var sum = el("div", "dash-sum"); Object.keys(by).forEach(function (k) { var o = by[k]; var a = el("span", "dash-pj", k); a.appendChild(el("em", o.open ? "o" : "z", o.open + " açık")); a.appendChild(el("em", "d", o.done + " cevaplandı")); sum.appendChild(a); }); b.appendChild(sum);
        if (!rows.length) b.appendChild(el("div", "dash-em", "Cevap bekleyen bir şey yok"));
        rows.slice(0, 5).forEach(function (x) {
          var a = el("a", "dash-it"); a.href = x.href; a.appendChild(el("span", "dash-id", x.it.id)); a.appendChild(el("span", "dash-tx", x.it.text)); a.appendChild(el("span", "dash-rc", x.it.rec));
          var ch = el("span", "dash-chips"); ch.appendChild(el("span", "dash-chip pj", x.pj)); ch.appendChild(el("span", "dash-chip " + (x.kind === "Soru" ? "soru" : "is"), x.kind)); ch.appendChild(el("span", "dash-chip acik", "Açık")); a.appendChild(ch); b.appendChild(a);
        });
        if (rows.length > 5) b.appendChild(el("div", "dash-em", "+ " + (rows.length - 5) + " tane daha"));
      }
      var sl = body("shelves"); if (sl) { r[0].forEach(function (s) { var o = by[s.name] || { open: 0, done: 0 }; var a = el("a", "dash-ch", s.name); a.href = "/shelves/" + s.slug; a.appendChild(el("i", "", s.n + " kitap · " + o.open + " açık")); sl.appendChild(a); }); count("shelves", r[0].length); }
    }).catch(function () { fail("wait"); fail("shelves"); });
    api("/books?count=200").then(function (bl) {
      var bookName = {}; bl.data.forEach(function (x) { bookName[x.id] = x.name; });
      var plans = bl.data.filter(function (x) { return x.name === "İş Planı"; });
      Promise.all(plans.map(function (x) { return api("/pages?count=10&sort=-updated_at&filter[book_id]=" + x.id); })).then(function (a) {
        var items = [].concat.apply([], a.map(function (x) { return x.data; })).sort(function (p, q) { return Date.parse(q.updated_at) - Date.parse(p.updated_at); });
        shelves.then(function () { list("prog", items.slice(0, 5).map(function (p) { return { text: p.name, href: "/link/" + p.id, meta: shelfOf[p.book_id] || ago(p.updated_at) }; }), items.length); });
      }).catch(function () { fail("prog"); });
      api("/pages?count=40&sort=-updated_at").then(function (l) {
        var items = l.data.filter(function (p) { return p.name !== "Panel"; }).slice(0, 5);
        list("recent", items.map(function (p) { return { text: p.name, href: "/link/" + p.id, meta: (bookName[p.book_id] || "") + " · " + ago(p.updated_at) }; }), "son " + items.length);
      }).catch(function () { fail("recent"); });
    }).catch(function () { fail("prog"); fail("recent"); });
  });
})();
</script>
<!-- selfhost-panel-end -->
