# Copied from upstream Penpot and modified for selfhost-stack.
# Source:  https://github.com/penpot/penpot/blob/2.18.6/docker/images/docker-compose.yaml
# Tag:     2.18.6
# License: MPL-2.0 (https://github.com/penpot/penpot/blob/2.18.6/LICENSE)
# Changes: removed penpot-mailpit, penpot-mcp, penpot-admin-console and the traefik example;
#          image tags pinned to full patch versions; secrets/port come from local/.env;
#          entry port bound to 127.0.0.1; all services on an internal network (the frontend
#          also joins a non-internal "edge" network, only so the published port works);
#          telemetry, SMTP, MCP and registration disabled; prepl-server off by default
#          (see PENPOT_EXTRA_FLAGS in README: enable it only to create the first profile).
#
# Flags: disable-registration blocks sign-up; the first user is created with prepl
# (PENPOT_EXTRA_FLAGS=enable-prepl-server in local/.env, then remove it again).
# enable-prepl-server must NOT be permanent: it opens an unauthenticated REPL on the backend.
x-flags: &penpot-flags
  PENPOT_FLAGS: "disable-email-verification disable-registration disable-secure-session-cookies ${PENPOT_EXTRA_FLAGS:-}"

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: "http://127.0.0.1:${PENPOT_PORT:?PENPOT_PORT missing in local/.env}"

x-body-size: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600

x-secret-key: &penpot-secret-key
  PENPOT_SECRET_KEY: "${PENPOT_SECRET_KEY:?PENPOT_SECRET_KEY missing in local/.env}"

x-database: &penpot-database
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: "${PENPOT_DB_PASSWORD:?PENPOT_DB_PASSWORD missing in local/.env}"

networks:
  penpot:
    internal: true
  edge:

volumes:
  penpot_postgres_v15:
  penpot_assets:

services:
  penpot-frontend:
    image: "penpotapp/frontend:2.18.6"
    restart: always
    ports:
      - target: 8080
        published: "${PENPOT_PORT:?PENPOT_PORT missing in local/.env}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
    networks:
      - penpot
      - edge
    environment:
      << : [*penpot-flags, *penpot-http-body-size, *penpot-public-uri]

  penpot-backend:
    image: "penpotapp/backend:2.18.6"
    restart: always
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      << : [*penpot-flags, *penpot-public-uri, *penpot-http-body-size, *penpot-secret-key, *penpot-database]
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_TELEMETRY_REFERER: compose

  penpot-exporter:
    image: "penpotapp/exporter:2.18.6"
    restart: always
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      << : [*penpot-flags, *penpot-secret-key, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: "postgres:15.20"
    restart: always
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    networks:
      - penpot
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=${PENPOT_DB_PASSWORD:?PENPOT_DB_PASSWORD missing in local/.env}

  penpot-valkey:
    image: "valkey/valkey:8.1.11"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - penpot
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu
